# Uygulama: manifests/app altındaki tüm YAML'lar app namespace'ine deploy edilir
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MustafaOgur/e2e-devops-platform-gitops.git
    targetRevision: main
    path: manifests/app
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      # Git'ten silinen kaynak cluster'dan da silinir; elle yapılan değişiklik geri alınır
      prune: true
      selfHeal: true
    # Sıfırdan kurulumda Sealed Secrets henüz hazır değilse senkronizasyon yeniden denenir
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
