# Loglar: Loki (log veritabanı) + Alloy (her node'da pod loglarını okuyup Loki'ye gönderen ajan)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 21.2.3
      helm:
        releaseName: loki
        valueFiles:
          - $values/platform/logging/loki-values.yaml
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.16.0
      helm:
        releaseName: alloy
        valueFiles:
          - $values/platform/logging/alloy-values.yaml
    - repoURL: https://github.com/MustafaOgur/e2e-devops-platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Sıfırdan kurulumda ServiceMonitor CRD'si (monitoring uygulaması) hazır değilse yeniden denenir
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
