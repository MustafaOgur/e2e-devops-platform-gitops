# İzleme: Prometheus, Grafana, Prometheus Operator, node-exporter, kube-state-metrics
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    # ServiceMonitor CRD'leri, onları kullanan uygulamalardan (todo, traefik) önce oluşsun
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.2.2
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/platform/monitoring/values.yaml
    - repoURL: https://github.com/MustafaOgur/e2e-devops-platform-gitops.git
      targetRevision: main
      ref: values
    # Chart dışındaki kaynaklar (Grafana admin SealedSecret)
    - repoURL: https://github.com/MustafaOgur/e2e-devops-platform-gitops.git
      targetRevision: main
      path: platform/monitoring/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD'ler çok büyük; normal apply'ın annotation sınırını (256KB) aşıyor
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
