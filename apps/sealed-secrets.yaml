# Sealed Secrets controller. Elle kurulmuş controller'ı aynı adlarla sahiplenir.
# Şifre çözme anahtarı (kube-system içindeki sealed-secrets-key Secret'ı) Git'te değildir ve dokunulmaz.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # SealedSecret kaynaklarını kullanan uygulamalardan önce oluşturulur
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/MustafaOgur/e2e-devops-platform-gitops.git
    targetRevision: main
    path: platform/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # Controller'ın yanlışlıkla silinmesine karşı prune kapalı
      prune: false
      selfHeal: true
