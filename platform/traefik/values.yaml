# Traefik Helm chart (traefik/traefik) ayarları.
# Yönlendirme sadece Gateway API ile yapılır; klasik Ingress ve Traefik'e özel CRD'ler kullanılmaz.

providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: false

ingressClass:
  enabled: false

# Chart'ın oluşturduğu Gateway: tüm cluster'ın tek giriş noktası
gateway:
  name: main
  listeners:
    web:
      # Rotalar app, argocd gibi farklı namespace'lerde tanımlanır
      namespacePolicy:
        from: All

service:
  # MetalLB her seferinde aynı IP'yi versin; hosts dosyası bu IP'yi kullanır
  annotations:
    metallb.io/loadBalancerIPs: 192.168.56.50

# Prometheus metrikleri: Gateway'den geçen her isteğin sayısı ve süresi, hedef servise göre
# (app-frontend-80, app-backend-8000...). Frontend trafiği buradan izlenir.
metrics:
  prometheus:
    # Metrik portu (9100) için ayrı bir Service; dışarıya açılmaz
    service:
      enabled: true
    serviceMonitor:
      enabled: true
    # Chart, ServiceMonitor CRD'si yoksa hata verir. Sıfırdan kurulumda CRD'ler monitoring
    # uygulamasıyla gelir; kontrol kapatılır, uygulamadaki retry CRD oluşana kadar dener
    disableAPICheck: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
