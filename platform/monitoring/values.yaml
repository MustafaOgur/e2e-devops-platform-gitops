# kube-prometheus-stack Helm chart ayarları.
# Küçük bir lab cluster'ı için: kısa saklama süresi, düşük kaynak, sadece erişilebilen hedefler.

# k3s'te controller-manager, scheduler ve kube-proxy tek bir k3s sürecinin içinde çalışır ve
# metriklerini sadece 127.0.0.1'den verir; etcd yerine SQLite kullanılır.
# Açık kalsalar Prometheus'ta sürekli "down" hedef ve gereksiz alarm olurdu.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# Bildirim gönderecek bir kanal yok; alarm kuralları yine Prometheus'ta görünür.
# Alarm bildirimleri gerektiğinde açılacak.
alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    # Sadece bu chart'ın etiketini taşıyanlar değil, tüm namespace'lerdeki
    # ServiceMonitor/PodMonitor/PrometheusRule kaynakları okunur (app, traefik)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Hangisi önce dolarsa: 3 gün veya 1GB
    retention: 3d
    retentionSize: 1GB

    # VM'ler sık kapatılıp açıldığı için veriler diskte tutulur (k3s local-path)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1Gi

grafana:
  # Kullanıcı adı ve şifre manifests/grafana-admin-sealedsecret.yaml'dan gelir
  admin:
    existingSecret: grafana-admin

  # http://grafana.test → Grafana arayüzü
  route:
    main:
      enabled: true
      hostnames:
        - grafana.test
      parentRefs:
        - name: main
          namespace: traefik
  # Grafana'nın ürettiği bağlantılar (yönlendirmeler, paylaşım linkleri) bu adresi kullanır
  grafana.ini:
    server:
      root_url: http://grafana.test

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi
