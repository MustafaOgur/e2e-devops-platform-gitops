# Grafana Alloy Helm chart (grafana/alloy) ayarları.
# Her node'da bir pod (DaemonSet): o node'daki container loglarını dosyadan okuyup Loki'ye gönderir.

alloy:
  # Alloy'un yapılandırması (Alloy'un kendi dili). Akış:
  # pod'ları bul → etiketle → log dosyalarını oku → CRI formatını çöz → Loki'ye gönder
  configMap:
    content: |
      // Kubernetes API'den bu node'daki pod'ları bul (HOSTNAME = node adı, chart ayarlar)
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // Az ve sabit değerli label'lar; trace_id gibi değerler log satırının içinde kalır
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // Container'ın log dosyası: /var/log/pods/<namespace>_<pod>_<uid>/<container>/0.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // containerd her satırı "zaman stdout F <log>" biçiminde yazar; cri bunu çözüp asıl log satırını bırakır
      loki.process "pods" {
        stage.cri {}
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

  # Node'daki /var/log klasörü (container logları burada) pod'a salt okunur bağlanır
  mounts:
    varlog: true

  # Grafana Labs'e kullanım istatistiği gönderilmez
  enableReporting: false

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

controller:
  type: daemonset
  # Control plane node'unun (cp1) logları da toplansın: taint'e rağmen orada da çalışır
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# Alloy'un kendi CRD'leri (PodLogs) kullanılmıyor
crds:
  create: false

# Alloy'un kendi metrikleri (okunan/gönderilen satır sayısı) Prometheus'a gitsin
serviceMonitor:
  enabled: true
