global:
  # Arayüzdeki bağlantılar bu adrese göre oluşturulur
  domain: argocd.test

configs:
  params:
    # Trafik Gateway (Traefik) üzerinden gelir; ArgoCD sunucusu düz HTTP konuşur
    server.insecure: true

# SSO kullanılmadığı için gerekmiyor
dex:
  enabled: false

# Bildirimler ilerideki bir aşamada açılacak
notifications:
  enabled: false

controller:
  # Controller izlediği tüm kaynakları bellekte tutar; kube-prometheus-stack'in büyük CRD'leri
  # ve ~100 kaynağı eklenince 512Mi sınırında OOMKilled oluyordu
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

server:
  # http://argocd.test → argocd-server (Gateway API rotası)
  httproute:
    enabled: true
    parentRefs:
      - name: main
        namespace: traefik
    hostnames:
      - argocd.test
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
