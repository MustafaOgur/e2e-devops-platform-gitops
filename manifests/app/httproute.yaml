# http://todo.test: /api → backend, geri kalan her şey → frontend.
# Tarayıcı frontend'i ve API'yi aynı adresten aldığı için CORS gerekmez.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo
  namespace: app
  labels:
    app.kubernetes.io/part-of: todo
spec:
  parentRefs:
    - name: main
      namespace: traefik
  hostnames:
    - todo.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
