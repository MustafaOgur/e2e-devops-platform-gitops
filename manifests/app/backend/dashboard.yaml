# Backend RED dashboard'u: istek sayısı (Rate), hatalar (Errors), gecikme (Duration).
# grafana_dashboard label'ı sayesinde Grafana'nın sidecar'ı bu ConfigMap'i bulup yükler.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-dashboard
  namespace: app
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: todo
data:
  backend.json: |
    {
      "uid": "todo-backend",
      "title": "Todo / Backend",
      "tags": ["todo", "backend"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "schemaVersion": 39,
      "panels": [
        {
          "type": "stat",
          "title": "Requests / sec",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 2 } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{job=\"backend\"}[$__rate_interval]))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "5xx error rate",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.01 },
                  { "color": "red", "value": 0.05 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(http_requests_total{job=\"backend\", status=~\"5..\"}[$__rate_interval])) or vector(0)) / sum(rate(http_requests_total{job=\"backend\"}[$__rate_interval]))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "p95 latency",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.3 },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"backend\"}[$__rate_interval])))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Pods up",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{job=\"backend\"})"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requests / sec by route",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (method, path) (rate(http_requests_total{job=\"backend\"}[$__rate_interval]))",
              "legendFormat": "{{method}} {{path}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requests / sec by status",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(http_requests_total{job=\"backend\"}[$__rate_interval]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency percentiles",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"backend\"}[$__rate_interval])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"backend\"}[$__rate_interval])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"backend\"}[$__rate_interval])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 latency by route",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, method, path) (rate(http_request_duration_seconds_bucket{job=\"backend\"}[$__rate_interval])))",
              "legendFormat": "{{method}} {{path}}"
            }
          ]
        },
        {
          "type": "logs",
          "title": "Errors and failed requests (logs)",
          "description": "ERROR/WARNING logs and requests with status >= 400. trace_id opens all logs of the same request. Panel menu > Explore shows all backend logs.",
          "gridPos": { "x": 0, "y": 20, "w": 24, "h": 10 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true,
            "dedupStrategy": "none"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"app\", app=\"backend\"} | json | level=~\"ERROR|WARNING\" or status >= 400"
            }
          ]
        }
      ]
    }
