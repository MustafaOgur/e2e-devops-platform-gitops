# Veritabanı tablolarını oluşturur/günceller, bitince durur.
# Job'ın pod şablonu değiştirilemez: yeni image ile tekrar çalıştırmak için Job silinip yeniden uygulanır.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: app
  labels:
    app.kubernetes.io/name: backend-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: todo
spec:
  # PostgreSQL henüz hazır değilse birkaç kez yeniden dener
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: todo
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: mustafaoqr/todo-backend:51f7ba5
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: backend
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
