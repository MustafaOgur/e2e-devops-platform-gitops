# Veritabanı tablolarını oluşturur/günceller, bitince durur.
# ArgoCD hook'u: her senkronizasyonda eski Job silinip yenisi çalıştırılır (Job'ın pod şablonu
# değiştirilemediği için). Wave 1: PostgreSQL (wave 0) hazır olduktan sonra, backend'den (wave 2) önce.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: app
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: backend-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: todo
spec:
  # PostgreSQL henüz hazır değilse birkaç kez yeniden dener
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: todo
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: mustafaoqr/todo-backend:51f7ba5
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: backend
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
