# Gizli olmayan ayarlar; değişmesi image'ı yeniden build etmeyi gerektirmez
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  namespace: app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: todo
data:
  # Uygulama ve API aynı adresten sunulduğu için tarayıcı CORS kontrolü yapmaz;
  # API başka bir adresten çağrılırsa diye uygulamanın adresi izinli
  CORS_ORIGINS: http://todo.test
