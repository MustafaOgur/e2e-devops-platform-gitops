apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: todo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      annotations:
        # ConfigMap değişince pod'lar kendiliğinden yeniden başlamaz (subPath);
        # bu değeri artırmak yeni pod'ların oluşturulmasını sağlar
        todo.app/config-revision: "2"
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: todo
    spec:
      containers:
        - name: frontend
          image: mustafaoqr/todo-frontend:10a1804
          ports:
            - name: http
              containerPort: 8080
          # Sadece config.js'in üzerine yazılır; klasördeki diğer dosyalar korunur
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: frontend
